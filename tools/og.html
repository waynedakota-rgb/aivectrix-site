<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Manrope;src:url(../public/fonts/manrope-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Inter;src:url(../public/fonts/inter-latin-600-normal.woff2);font-weight:600}
html,body{margin:0}
.og{width:1200px;height:630px;position:relative;overflow:hidden;background:radial-gradient(90% 90% at 90% 10%,rgba(185,121,79,.10),transparent 60%),linear-gradient(180deg,#0D1011,#151819);font-family:Inter}
.logo{position:absolute;left:80px;top:72px;height:40px}
h1{position:absolute;left:80px;top:210px;margin:0;font:700 92px/0.98 Manrope;letter-spacing:-.035em;color:#F5F2EB}
h1 span{display:block}h1 span+span{color:#BDC3C2}
p{position:absolute;left:80px;bottom:64px;margin:0;font:600 18px Inter;letter-spacing:.16em;text-transform:uppercase;color:#D9AA85}
svg.lines{position:absolute;right:-40px;top:40px;width:720px;opacity:.9;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%)}
</style></head><body><div class="og">
<img class="logo" src="../public/brand/aivectrix-logo-light.svg">
<svg class="lines" viewBox="0 0 1000 700" id="lines"></svg>
<h1><span>Complex challenges.</span><span>Meaningful results.</span></h1>
<p>People. Processes. Technology. Data.</p>
</div><script>
const lane=o=>[[40,560+o*2.6],[300,560+o*2.6],[420,420+o*1.1],[600,352+o],[740,300+o],[850,216+o],[990,150+o]];
const s=document.getElementById('lines');
[-36,-12,12,36].forEach((o,i)=>{const q=lane(o).map(p=>p.join(' '));s.insertAdjacentHTML('beforeend',`<path d="M${q[0]}C${q[1]} ${q[2]} ${q[3]}C${q[4]} ${q[5]} ${q[6]}" fill="none" stroke="${i==0?'#D9AA85':'rgba(189,195,194,.55)'}" stroke-width="${i==0?2.4:1.8}" stroke-linecap="round"/>`)});
</script></body></html>
